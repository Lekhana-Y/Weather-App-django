<!DOCTYPE html>
<html>

<head>

<title>Weather App</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:linear-gradient(135deg,#667eea,#764ba2);
min-height:100vh;
font-family:Arial;
}

.weather-card{
border-radius:20px;
overflow:hidden;
transition:.3s;
background:rgba(255,255,255,0.9);
backdrop-filter:blur(10px);
border:none;
}

.weather-card:hover{
transform:translateY(-8px);
}

.city-img{
height:180px;
object-fit:cover;
}

.search-card{
border-radius:20px;
background:white;
}

.temp{
font-size:28px;
font-weight:bold;
}

.desc{
color:gray;
text-transform:capitalize;
}

.delete-btn{
position:absolute;
right:10px;
top:10px;
}

</style>

</head>

<body>

<div class="container">

<h1 class="text-center text-white mt-4 mb-4">
Weather Dashboard
</h1>

<div class="row justify-content-center">

<div class="col-md-6">

<form method="POST" class="card search-card shadow p-3 mb-4">

{% csrf_token %}

<div class="input-group">

<input type="text"
name="city"
class="form-control"
placeholder="Search city weather">

<button class="btn btn-dark">
Search
</button>

</div>

</form>

</div>

</div>

{% if error %}

<div class="alert alert-danger text-center">

{{ error }}

</div>

{% endif %}

<div class="row">

{% for city_weather in weather_data %}

<div class="col-md-4">

<div class="card weather-card shadow mb-4">

<img src="{{ city_weather.image }}"
class="city-img">

<div class="card-body text-center">

<form method="POST">

{% csrf_token %}

<button
name="delete_city"
value="{{ city_weather.city }}"
class="btn btn-danger btn-sm delete-btn">

X

</button>

</form>

<h4>{{ city_weather.city }}</h4>

<div class="temp">
{{ city_weather.temperature }}°C
</div>

<p class="desc">
{{ city_weather.description }}
</p>

<img src="http://openweathermap.org/img/w/{{ city_weather.icon }}.png">

</div>

</div>

</div>

{% endfor %}

</div>

</div>

</body>

</html>
